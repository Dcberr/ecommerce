apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: ecommerce
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: S3_SECRET_KEY
          command:
            - /bin/sh
            - -c
            - |
              mc alias set myminio http://minio:9000 $S3_ACCESS_KEY $S3_SECRET_KEY
              mc mb myminio/images-ecommerce --ignore-existing
              mc anonymous set public myminio/images-ecommerce
